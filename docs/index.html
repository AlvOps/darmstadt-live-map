<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<title>Darmstadt Live Map</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<script src="i18n.js?v=20261014-6"></script>
<script>document.documentElement.lang = window.I18N.detect();</script>
<link href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/deck.gl@9.1.4/dist.min.js"></script>
<style>
  :root {
    --bg: #0b0d12; --panel: rgba(16, 19, 26, 0.95); --line: rgba(255,255,255,0.09);
    --text: #e8eaf0; --muted: #8a90a0; --accent: #ffd166; --fg: #e8eaf0;
    --tram: #ff6b6b; --bus: #2ec4b6; --rail: #c77dff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  #map { position: absolute; inset: 0; }
  .panel { position: absolute; z-index: 2; background: var(--panel); backdrop-filter: blur(10px);
    border: 1px solid var(--line); border-radius: 14px; }
  #head { top: 6px; left: 12px; padding: 10px 13px; max-width: 300px; }
  #head h1 { margin: 0 0 2px; font-size: 17px; font-weight: 650; letter-spacing: .01em; }
  #head p { margin: 0; color: var(--muted); font-size: 12.5px; }
  .sec { margin-top: 14px; }
  .lbl { font-size: 10.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 6px; }
  #counts { display: flex; gap: 20px; }
  .cnt b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; font-weight: 650; line-height: 1.15; }
  .cnt span { font-size: 11.5px; color: var(--muted); display: flex; align-items: center; gap: 5px; }
  .cnt i, .tog i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
  .cnt.off { opacity: .35; }
  #toggles { display: flex; flex-wrap: wrap; gap: 6px; }
  .tog { display: inline-flex; align-items: center; gap: 7px; padding: 5px 10px 5px 8px; font-size: 12.5px; }
  .tog .box { width: 14px; height: 14px; border-radius: 4px; border: 1.5px solid var(--muted);
    display: grid; place-items: center; font-size: 10px; line-height: 1; color: #111; }
  .tog[aria-pressed="true"] .box { background: var(--accent); border-color: var(--accent); }
  .tog[aria-pressed="true"] .box::after { content: "✓"; font-weight: 800; }
  .tog[aria-pressed="false"] { color: var(--muted); }
  /* Panel: immer nur ein Bereich (Umschalter oben) -> passt ohne Scrollbalken. overflow bleibt nur
     als unsichtbares Sicherheitsnetz, falls sehr großer Zoom doch mehr Platz verlangt. */
  #head { display: flex; flex-direction: column; overflow-y: auto; overscroll-behavior: contain;
    max-height: var(--head-max, calc(100vh - 32px)); scrollbar-width: none; }
  #head::-webkit-scrollbar { width: 0; height: 0; }
  #legend-sec { flex: 0 0 auto; min-height: 0; display: flex; flex-direction: column; }
  /* Linienliste ohne eigenen Scrollbalken: sie wächst mit, solange das Panel in den Bildschirm passt */
  #legend { flex: 0 0 auto; min-height: 0; max-height: none; overflow: visible; }
  /* Umschalter zwischen Linien und Status */
  #panes { margin-top: 10px; align-self: flex-start; }
  #panes button { padding: 6px 11px; font-size: 12.5px; }
  body[data-pane="status"] #legend-sec { display: none; }
  body[data-pane="lines"] #presentation { display: none; }
  #legend details { border-top: 1px solid var(--line); }
  #legend summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 6px;
    padding: 9px 0; font-size: 12.5px; user-select: none; }
  #legend summary::-webkit-details-marker { display: none; }
  #legend summary::before { content: "▸"; color: var(--muted); font-size: 10px; width: 10px; transition: transform .15s; }
  #legend details[open] summary::before { transform: rotate(90deg); }
  #legend .chips { display: flex; flex-wrap: wrap; gap: 5px; padding: 0 0 11px 16px; }
  #selinfo { font-size: 12px; margin-bottom: 6px; display: none; align-items: baseline; gap: 6px; }
  #selinfo button { padding: 1px 7px; font-size: 11px; border-radius: 6px; margin-left: auto; flex: none; }
  .chip { font-size: 12px; font-weight: 600; padding: 5px 10px; border-radius: 7px; cursor: pointer;
    color: #111; border: 2px solid transparent; display: inline-flex; align-items: center; min-height: 28px; }
  .chip.sel { border-color: #fff; }
  #bar { left: 16px; right: 16px; bottom: 16px; padding: 12px 16px 14px; }
  #row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  #clock { font-size: 34px; font-weight: 650; font-variant-numeric: tabular-nums; min-width: 105px; letter-spacing: .02em; }
  button, select { background: rgba(255,255,255,.07); color: var(--text); border: 1px solid var(--line);
    border-radius: 9px; padding: 7px 12px; font: inherit; cursor: pointer; }
  button:hover, select:hover { background: rgba(255,255,255,.13); }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; background: transparent; }
  .seg button.on { background: rgba(255,209,102,.18); color: var(--accent); }
  #hint { margin-left: auto; color: var(--muted); font-size: 12px; max-width: 260px; text-align: right; }
  #timeline { position: relative; margin-top: 10px; height: 46px; }
  #timeline canvas { width: 100%; height: 100%; display: block; }
  #tip { position: absolute; pointer-events: none; padding: 6px 9px; font-size: 12.5px; display: none;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px; z-index: 5; }
  #loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); z-index: 9; background: var(--bg); }
  .maplibregl-ctrl-attrib { background: rgba(0,0,0,.5) !important; font-size: 10px; }
  .maplibregl-ctrl-attrib a { color: #aaa !important; }

  /* --- Echtzeit --- */
  .livestat { display: flex; flex-wrap: wrap; gap: 2px 12px; font-size: 12px; color: var(--muted); margin-top: 8px; }
  .livestat b { color: var(--text); }
  #livestat2 { font-size: 11.5px; color: var(--muted); margin-top: 6px; }
  .badge-live { display: inline-flex; align-items: center; gap: 6px; font-size: 10.5px; font-weight: 600;
    letter-spacing: .07em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; margin-left: 8px;
    background: rgba(46,196,182,.16); color: #2ec4b6; border: 1px solid rgba(46,196,182,.35); vertical-align: 2px; }
  .badge-live i { width: 7px; height: 7px; border-radius: 50%; background: #2ec4b6; animation: bpulse 1.6s infinite; }
  @keyframes bpulse { 0%,100% { opacity: 1 } 50% { opacity: .2 } }
  /* --- Sprachumschalter (oben rechts) --- */
  #lang { top: 16px; right: 16px; padding: 6px; z-index: 4; top: calc(16px + env(safe-area-inset-top)); }
  #lang .seg button { padding: 7px 11px; font-size: 12.5px; font-weight: 600; min-width: 40px; }

  /* --- Fahrzeug-Popup: sitzt am angeklickten Fahrzeug (Position setzt live.js), Telefon: Bottom-Sheet --- */
  #popup { display: none; z-index: 6; padding: 10px 12px 11px; width: 304px; max-width: 304px;
    left: -9999px; top: 0; scrollbar-gutter: stable; touch-action: pan-y; }
  #popup.on { display: block; }
  #popup.dragging { cursor: grabbing; }
  /* Verbindungslinie vom Popup zum Punkt: signalisiert eindeutig, welcher Punkt gemeint ist */
  #leader { position: absolute; inset: 0; z-index: 5; pointer-events: none; display: none; }
  #leader.on { display: block; }
  #leader path { fill: none; stroke: rgba(255, 255, 255, .6); stroke-width: 1.6; stroke-dasharray: 5 4;
    stroke-linecap: round; }
  #leader circle { fill: rgba(255, 255, 255, .8); stroke: rgba(16, 20, 28, .6); stroke-width: 1.5; }
  /* Panel-Schublade und ihr Schalter gibt es nur auf dem Telefon (siehe @media unten) */
  #paneltoggle, #panelclose { display: none; }
  .pop-head { display: flex; align-items: center; gap: 8px; cursor: grab; touch-action: none; }
  .pop-line { font-size: 13px; font-weight: 700; color: #111; padding: 2px 8px; border-radius: 7px; flex: none; }
  .pop-title { font-weight: 650; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pop-close { margin-left: auto; flex: none; padding: 4px 9px; font-size: 12px; border-radius: 8px; }
  .pop-delay { display: inline-block; font-size: 12px; font-weight: 650; padding: 3px 9px; border-radius: 999px; margin-top: 8px; }
  .pop-delay.late { background: rgba(255,90,80,.16); color: #ff9b93; }
  .pop-delay.ontime { background: rgba(120,220,160,.16); color: #86e0a8; }
  .pop-delay.early { background: rgba(110,180,255,.16); color: #8ecbff; }
  .pop-delay.unknown { background: rgba(255,255,255,.08); color: var(--text); }
  .pop-sub { color: var(--muted); font-size: 11.5px; margin-top: 7px; line-height: 1.45; }
  .pop-stops { list-style: none; margin: 10px 0 0; padding: 0; max-height: 34vh; overflow-y: auto; touch-action: pan-y; }
  .pop-stops li { display: flex; align-items: baseline; gap: 8px; padding: 7px 0; border-top: 1px solid var(--line); font-size: 12.5px; }
  /* Halte in der Fahrzeugkarte: anklickbar, mit sichtbarer Andeutung */
  .pop-stops li.st-go { cursor: pointer; }
  .pop-stops li.st-go:hover { background: rgba(255,255,255,.06); }
  .pop-stops li.st-go .st-name { text-decoration: underline dotted rgba(255,255,255,.3); text-underline-offset: 2px; }
  .pop-stops li.st-go::after { content: "›"; color: var(--muted); flex: none; }
  .pop-stops .st-name { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pop-stops .st-line { font-size: 10px; font-weight: 700; color: #111; padding: 1px 6px; border-radius: 5px;
    flex: none; min-width: 26px; text-align: center; }
  .pop-stops .st-clock { font-variant-numeric: tabular-nums; color: var(--text); font-weight: 650; flex: none; }
  .pop-stops .st-rel { color: var(--muted); font-size: 11.5px; flex: none; }
  .pop-stops .st-dly { font-variant-numeric: tabular-nums; font-weight: 600; flex: none; min-width: 34px; text-align: right; }
  .pop-stops .st-dly.late { color: #ff9b93; }
  .pop-stops .st-dly.ontime { color: #86e0a8; }
  .pop-stops .st-dly.early { color: #8ecbff; }
  .pop-stops .st-dly.unknown { color: var(--muted); }
  .pop-note { color: var(--muted); font-size: 11px; margin-top: 10px; line-height: 1.4; }

  #banner { position: absolute; z-index: 3; top: 16px; left: 50%; transform: translateX(-50%);
    max-width: min(560px, 90vw); padding: 9px 14px; font-size: 12.5px; background: rgba(255,90,80,.14);
    border: 1px solid rgba(255,90,80,.4); border-radius: 10px; color: #ffd9d6; backdrop-filter: blur(8px); }

  /* --- Scrollbalken passend zum Design (dünn, durchscheinend, ohne Spur) --- */
  :root { --scroll-thumb: var(--muted); --scroll-thumb-hover: var(--accent); }
  @supports (color: color-mix(in srgb, red, blue)) {
    :root { --scroll-thumb: color-mix(in srgb, var(--muted) 45%, transparent);
            --scroll-thumb-hover: color-mix(in srgb, var(--accent) 70%, transparent); }
  }
  .panel, #legend, .pop-stops { overscroll-behavior: contain; }
  @supports (scrollbar-width: thin) {
    .panel, .pop-stops { scrollbar-width: thin; scrollbar-color: var(--scroll-thumb) transparent; }
  }
  .panel::-webkit-scrollbar, .pop-stops::-webkit-scrollbar { width: 9px; height: 9px; }
  .panel::-webkit-scrollbar-track, .pop-stops::-webkit-scrollbar-track { background: transparent; }
  .panel::-webkit-scrollbar-corner, .pop-stops::-webkit-scrollbar-corner { background: transparent; }
  .panel::-webkit-scrollbar-thumb, .pop-stops::-webkit-scrollbar-thumb {
    background: var(--scroll-thumb); border-radius: 999px; border: 2px solid transparent; background-clip: padding-box; }
  .panel::-webkit-scrollbar-thumb:hover, .pop-stops::-webkit-scrollbar-thumb:hover {
    background: var(--scroll-thumb-hover); background-clip: padding-box; }

  /* --- Telefon/Touch: Linienliste zuerst, eine einzige Scrollfläche, große Ziele --- */
  /* Auch für Touch-Geräte über 700 px Breite (Telefon im Querformat), sonst gäbe es dort weder
     Schublade noch Schalter und das Panel bliebe einfach stehen. */
  @media (max-width: 700px), (hover: none) and (pointer: coarse) {
    #head { top: calc(56px + env(safe-area-inset-top)); left: 8px; right: 72px; padding: 9px 11px 10px;
      max-width: none; max-height: 62vh; overflow-y: auto; overscroll-behavior: contain; }
    #head h1 { font-size: 15px; }
    #head p { font-size: 11.5px; }
    #legend { overflow: visible; max-height: none; min-height: 0; margin-right: 0; padding-right: 0; scrollbar-gutter: auto; }
    #legend summary { padding: 12px 0; font-size: 14px; min-height: 44px; }
    #legend .chips { gap: 6px; padding: 0 0 12px 0; }
    .chip { font-size: 13.5px; padding: 9px 13px; min-height: 40px; border-radius: 8px; }
    #panes { align-self: stretch; display: flex; }
    #panes button { flex: 1 1 0; min-height: 44px; font-size: 13.5px; }
    #selinfo { font-size: 13.5px; }
    #selinfo button { min-width: 40px; min-height: 40px; font-size: 15px; padding: 0; }
    .pop-stops li { padding: 11px 0; }
    #toggles { gap: 6px; }
    .tog { padding: 6px 9px; font-size: 12px; min-height: 40px; }
    .pop-close { min-width: 40px; min-height: 40px; font-size: 14px; }
    #counts { gap: 14px; }
    .cnt b { font-size: 19px; }
    .cnt span { font-size: 10.5px; }
    #lang { top: calc(6px + env(safe-area-inset-top)); right: 8px; padding: 4px; }
    #lang .seg button { padding: 9px 10px; min-width: 42px; }
    #bar { left: 8px; right: 8px; bottom: calc(8px + env(safe-area-inset-bottom)); padding: 9px 12px 10px; }
    #row { gap: 8px; }
    #clock { font-size: 22px; min-width: 64px; }
    .seg button { padding: 9px 11px; min-height: 40px; }
    #timeline { height: 36px; }
    #hint { font-size: 11px; max-width: none; }
    #popup { left: 8px; right: 8px; top: auto; width: auto; max-width: none; bottom: calc(var(--bar-h, 104px) + 16px + env(safe-area-inset-bottom)); max-height: 46vh; overflow-y: auto; }
    /* Panel als Schublade: standardmäßig offen, verschwindet beim Tippen auf die Karte.
       Der Schalter sitzt IMMER an derselben Stelle (oben links, direkt über dem Panel) und ändert
       Beschriftung und Symbol: „☰ Lines" öffnet, „✕ Close panel" schließt. So ist ohne Raten klar,
       was der Knopf tut. Der Balken/das Sheet bleiben unten unberührt. */
    body.panel-closed #head { display: none; }
    #paneltoggle { display: inline-flex; align-items: center; gap: 7px; position: absolute; z-index: 5;
      top: calc(6px + env(safe-area-inset-top)); left: 8px;
      padding: 10px 13px; min-height: 44px; font: inherit; font-size: 13.5px; font-weight: 600;
      color: var(--fg); cursor: pointer; }
    #paneltoggle[aria-expanded="true"] { color: var(--accent); border-color: rgba(255,209,102,.45); }
    #panelclose { display: inline-flex; align-items: center; justify-content: center; margin-left: auto; flex: none;
      min-width: 40px; min-height: 40px; font-size: 15px; border-radius: 8px; background: rgba(255,255,255,.06);
      border: 1px solid var(--line); color: var(--fg); cursor: pointer; }
    /* Telefon: die Karte bleibt Bottom-Sheet, Ziehen ist dort aus (nur Maus) */
    .pop-head { cursor: default; touch-action: auto; }
    .pop-stops { max-height: none; }
    #banner { top: calc(70px + env(safe-area-inset-top)); font-size: 12px; }
    #tip { display: none !important; }        /* auf Touch gibt es nur das Popup */
  }
  @media (min-width: 701px) {
    #popup { max-height: 44vh; overflow-y: auto; }   /* Position und Breite kommen aus live.js/CSS-Basis */
  }
</style>
</head>
<body>
<div id="map"></div>
<!-- Verbindungslinie vom Popup zum markierten Punkt (live.js zeichnet sie) -->
<svg id="leader" aria-hidden="true"><path></path><circle r="3.5"></circle></svg>
<!-- Telefon: Panel ist eine Schublade — dieser Schalter holt es zurück, wenn es sich geschlossen hat -->
<button id="paneltoggle" class="panel" aria-expanded="true" data-i18n-aria="openPanel" aria-label="Show lines">
  <span aria-hidden="true">☰</span> <span data-i18n="openPanel">Lines</span></button>
<div id="loading" data-i18n="loading">Loading …</div>

<div id="lang" class="panel">
  <div class="seg" role="group" data-i18n-aria="langGroup" aria-label="Language">
    <button data-lang="en" aria-pressed="true">EN</button><button data-lang="de" aria-pressed="false">DE</button>
  </div>
</div>

<div id="head" class="panel">
  <h1><span data-i18n="appTitle">Darmstadt Live Map</span><span class="badge-live" id="livebadge"><i></i><span id="livebadgetxt" data-i18n="modeLive">Realtime</span></span>
    <button id="panelclose" class="panel-x" data-i18n-aria="closePanel" aria-label="Close panel">✕</button></h1>

  <!-- Umschalter: immer nur ein Bereich sichtbar -> das Panel passt ohne Scrollbalken -->
  <div class="seg" id="panes" role="group">
    <button data-pane="lines" class="on" aria-pressed="true" data-i18n="legendTitle">Lines</button><button data-pane="status" aria-pressed="false" data-i18n="presentation">Status &amp; filters</button>
  </div>

  <!-- Linienliste steht oben: sie ist das wichtigste Bedienelement, nicht die Statistik -->
  <div class="sec" id="legend-sec">
    <div id="selinfo"><span id="selname"></span><button id="selclear" data-i18n-title="clear" data-i18n-aria="clear" aria-label="Clear highlight">✕</button></div>
    <div id="legend"></div>
  </div>

  <div class="sec" id="presentation">
    <p data-i18n="subtitle">Tram, bus and regional rail — from the open realtime feed</p>
    <div class="sec">
      <div id="livestat2" data-i18n="waiting">waiting for first data …</div>
      <div id="routenote" class="pop-note"></div>
    </div>
    <div class="sec">
      <div class="lbl" data-i18n="showOnMap">Show on map</div>
      <div id="toggles">
        <button class="tog" data-mode="tram" aria-pressed="true"><span class="box"></span><i style="background:var(--tram)"></i><span data-i18n="togTram">Tram</span></button>
        <button class="tog" data-mode="bus" aria-pressed="true"><span class="box"></span><i style="background:var(--bus)"></i><span data-i18n="togBus">Bus</span></button>
        <button class="tog" data-mode="rail" aria-pressed="true"><span class="box"></span><i style="background:var(--rail)"></i><span data-i18n="togRail">Regional rail</span></button>
      </div>
    </div>
    <div class="sec">
      <div class="lbl" data-i18n="heading">On the road now</div>
      <div id="counts">
        <div class="cnt" data-mode="tram"><b id="n-tram">0</b><span><i style="background:var(--tram)"></i><span data-i18n="trams">Trams</span></span></div>
        <div class="cnt" data-mode="bus"><b id="n-bus">0</b><span><i style="background:var(--bus)"></i><span data-i18n="buses">Buses</span></span></div>
        <div class="cnt" data-mode="rail"><b id="n-rail">0</b><span><i style="background:var(--rail)"></i><span data-i18n="trains">Trains</span></span></div>
      </div>
      <div class="livestat" id="livestat"></div>
    </div>
  </div>
</div>

<div id="bar" class="panel">
  <div id="row">
    <div id="clock">--:--</div>
    <span id="hint" data-i18n="hint">Tap a vehicle for line, delay and next stops</span>
  </div>
  <div id="timeline"><canvas id="tl"></canvas></div>
</div>
<div id="tip"></div>
<div id="banner" hidden></div>
<div id="popup" class="panel" role="dialog" data-i18n-aria="popup.dialog" aria-label="Vehicle details"></div>

<script src="live.js?v=20261014-6"></script>
<script>
const MODE_RGB = { tram: [255,107,107], bus: [46,196,182], rail: [199,125,255] };
const hex = h => [1,3,5].map(i => parseInt(h.slice(i, i+2), 16));
const esc = x => String(x == null ? '' : x).replace(/[&<>"']/g,
  c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// Zustand: nur noch die Echtzeit-Ansicht. Die Ruheuhr (selAt) teilt sich diese Datei mit live.js:
// eine gewählte Linie zeigt nur diese Linie; nach 10 s ohne Interaktion kommen die Haltestellen zurück.
const state = { modes: { tram: true, bus: true, rail: true }, selLine: null, selAt: 0 };
let META;

// ---------- Karte
const BASEMAP_STYLE = 'https://basemaps.cartocdn.com/gl/dark-matter-nolabels-gl-style/style.json';
// CARTOs Vektor-Kacheln enden bei z14 (am 2026-10-14 gemessen: z14 = HTTP 200, z15 und tiefer = 404).
// Die Style-Datei nennt kein maxzoom, deshalb fragt MapLibre beim Hineinzoomen Kacheln ab, die es
// nicht gibt — die Grundkarte bleibt dann auf der zuletzt geladenen Zoomstufe stehen und wirkt beim
// Zoomen "eingefroren". Darum wird die TileJSON-Quelle durch eine feste Vorlage mit maxzoom 14
// ersetzt: darüber skaliert MapLibre die z14-Kacheln selbst (Overzoom), die Karte bleibt weich.
const TILE_SUBS = ['a', 'b', 'c', 'd'];
const TILE_MAXZOOM = 14;
function inlineTileSource() {
  const style = map.getStyle();
  const src = style.sources && style.sources.carto;
  if (!src || !src.url) return false;                    // schon gepatcht oder unerwartete Struktur
  src.tiles = TILE_SUBS.map(s =>
    `https://tiles-${s}.basemaps.cartocdn.com/vectortiles/carto.streets/v1/{z}/{x}/{y}.mvt`);
  src.minzoom = 0;
  src.maxzoom = TILE_MAXZOOM;
  delete src.url;                                        // sonst gilt weiter die Angabe der TileJSON
  map.setStyle(style, { diff: false });
  return true;
}
const map = new maplibregl.Map({
  container: 'map',
  style: BASEMAP_STYLE,
  center: [8.652, 49.872], zoom: 12.3, pitch: 0, bearing: 0, maxPitch: 60, maxZoom: 16,   // Nordansicht als Standard
  attributionControl: false             // eigene, übersetzte Quellenangabe (siehe setAttribution)
});
let basemapCapped = false;
map.on('style.load', () => {            // einmalig nach dem ersten Laden begrenzen
  if (basemapCapped) return;
  try { basemapCapped = inlineTileSource(); }
  catch (err) { console.warn('basemap-tile-cap-failed', err); }
});
// Quellenangabe in der aktuellen Sprache; beim Sprachwechsel neu einsetzen
let attribCtrl = null;
function setAttribution() {
  const T = k => (window.I18N ? window.I18N.t(k) : k);
  if (attribCtrl) map.removeControl(attribCtrl);
  attribCtrl = new maplibregl.AttributionControl({ compact: true,
    customAttribution: [T('attributionLive'), T('attributionMap')].map(esc).join(' · ') });
  map.addControl(attribCtrl, 'bottom-right');
  if (typeof placeCtrls === 'function') placeCtrls();
}
const overlay = new deck.MapboxOverlay({ interleaved: false, layers: [] });
map.addControl(overlay);
map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), 'bottom-right');

const tip = document.getElementById('tip');

// Stationsnamen kürzen: "Darmstadt-Eberstadt Frankenstein" -> "Eberstadt Frankenstein"
const shortStop = n => String(n == null ? '' : n).replace(/^Darmstadt[- ]/, '');
const lineEnds = l => l.ends.map(shortStop).join(' ↔ ');

  // Touch-Erkennung: NICHT nur über die Breite — ein Telefon im Querformat (oder ein großes Gerät)
  // ist über 700 px breit, hatte damit nie eine Schublade und der Panel blieb einfach stehen.
  const touchLayout = () => !!(window.matchMedia && window.matchMedia('(hover: none) and (pointer: coarse)').matches)
                        || window.innerWidth <= 700;
  let hidePanelNow = null;                  // wird von der Panel-Logik unten gesetzt

function selectLine(li) {
  state.selLine = state.selLine === li ? null : li;
  state.selAt = Date.now();        // Ruheuhr: 10 s nach der Auswahl kommen die Haltestellen zurück
  document.querySelectorAll('.chip').forEach(c => c.classList.toggle('sel', +c.dataset.line === state.selLine));
  const info = document.getElementById('selinfo');
  window.DarmstadtLive.render(true);
  if (state.selLine === null) { info.style.display = 'none'; return; }
  const l = META.lines[state.selLine];
  document.getElementById('selname').innerHTML = `<b>${esc(l.name)}</b> <span style="color:var(--muted)">${esc(lineEnds(l))}</span>`;
  info.style.display = 'flex';
  const chip = document.querySelector(`.chip[data-line="${state.selLine}"]`);
  if (chip) { chip.closest('details').open = true; chip.scrollIntoView({ block: 'nearest' }); }
  // Auf dem Telefon nimmt sich das Panel nach der Linienwahl weg: er will die Linie auf der Karte
  // sehen, nicht die Liste. (Löschen der Auswahl lässt das Panel offen.)
  if (touchLayout() && hidePanelNow) hidePanelNow();
}

// Linienleiste nach Verkehrsart/Betreiber gruppiert
const GROUPS = [
  { key: 'grpTram', open: true, modes: ['tram'], test: l => l.mode === 'tram' },
  { key: 'grpS', open: true, modes: ['rail'], test: l => l.mode === 'rail' && l.name.startsWith('S') },
  { key: 'grpRegional', modes: ['rail'], test: l => l.mode === 'rail' },
  { key: 'grpBusHeag', modes: ['bus'], test: l => l.agency === 'HEAG' },
  { key: 'grpBusDadina', modes: ['bus'], test: l => l.agency === 'DADINA' },
  { key: 'grpBusRmv', modes: ['bus'], test: l => l.agency === 'RMV' },
  { key: 'grpBusOther', modes: ['bus'], test: () => true },
];
function buildLegend() {
  const lg = document.getElementById('legend'), done = new Set();
  const T = k => (window.I18N ? window.I18N.t(k) : k);
  const keepScroll = lg.scrollTop;                     // Scrollposition beim Neuaufbau halten
  lg.innerHTML = '';                                  // nötig beim Sprachwechsel
  const byName = (a, b) => a.l.name.localeCompare(b.l.name, window.I18N ? window.I18N.lang : 'de', { numeric: true });
  for (const g of GROUPS) {
    const items = META.lines.map((l, i) => ({ l, i })).filter(x => !done.has(x.i) && g.test(x.l)).sort(byName);
    if (!items.length) continue;
    items.forEach(x => done.add(x.i));
    const det = document.createElement('details'); det.open = !!g.open;
    // Bewusst ohne Anzahl der Linien: der Betreiber will nur die Linien sehen
    det.innerHTML = `<summary>${esc(T(g.key))}</summary><div class="chips"></div>`;
    const box = det.querySelector('.chips');
    for (const { l, i } of items) {
      const c = document.createElement('span'); c.className = 'chip'; c.dataset.line = i;
      c.textContent = l.name; c.style.background = l.color; c.onclick = () => selectLine(i);
      c.onmouseenter = e => { tip.innerHTML = `<b>${esc(l.name)}</b> ${esc(lineEnds(l))}`; tip.style.display = 'block';
        const r = c.getBoundingClientRect(); tip.style.left = document.getElementById('head').getBoundingClientRect().right + 8 + 'px'; tip.style.top = r.top - 4 + 'px'; };
      c.onmouseleave = () => { tip.style.display = 'none'; };
      box.appendChild(c);
    }
    lg.appendChild(det);
  }
  lg.scrollTop = keepScroll;                          // Position wiederherstellen
}

// Kartenbedienelemente immer über der unteren Leiste halten
function placeCtrls() {
  const bar = document.getElementById('bar');
  const bh = bar ? bar.offsetHeight : 0, off = bh + 24 + 'px';
  document.documentElement.style.setProperty('--head-max', `min(calc(100vh - ${bh + 30}px), 92vh)`);
  document.documentElement.style.setProperty('--bar-h', bh + 'px');   // Bottom-Sheet sitzt über der Leiste
  document.querySelectorAll('.maplibregl-ctrl-bottom-right, .maplibregl-ctrl-bottom-left').forEach(e => e.style.bottom = off);
}
addEventListener('resize', placeCtrls); placeCtrls();
if (window.ResizeObserver) new ResizeObserver(placeCtrls).observe(document.getElementById('bar'));

// Verkehrsart ein-/ausblenden
document.querySelectorAll('.tog').forEach(c => c.onclick = () => {
  const m = c.dataset.mode; state.modes[m] = !state.modes[m];
  c.setAttribute('aria-pressed', state.modes[m]);
  document.querySelector(`.cnt[data-mode="${m}"]`).classList.toggle('off', !state.modes[m]);
  window.DarmstadtLive.render(true);
});

(async () => {
  // GitHub Pages liefert auch das HTML mit 10 Minuten Cache (nachgemessen: `cache-control: max-age=600`);
  // eine Versionskennung nur für Skripte reicht also nicht. Eine alte Seite kann mit neuem live.js laufen
  // und hat dann z. B. keinen Schalter, weil das Markup fehlt. live.js wird versioniert geladen und weiß,
  // welche Fassung aktuell ist — bei Abweichung einmal auf eine versionierte URL wechseln.
  const APP_V = '20261014-6';
  try {
    const fresh = window.DarmstadtLive && window.DarmstadtLive.VERSION;
    if (fresh && fresh !== APP_V && sessionStorage.getItem('dlm-v') !== fresh) {
      sessionStorage.setItem('dlm-v', fresh);
      location.replace(location.pathname + '?v=' + fresh);
      return;
    }
  } catch (_) { /* Privatmodus: dann eben ohne Selbstheilung */ }
  window.I18N.init();                       // Sprache zuerst: Vorgabe EN, Merker in localStorage
  // meta.json liefert Linien, Farben und Endpunkte für die Linienleiste
  META = await fetch('data/meta.json').then(r => r.json());
  buildLegend();
  document.getElementById('selclear').onclick = () => selectLine(state.selLine);
  // Das Mausrad über den Bedienfeldern darf die Karte darunter nicht zoomen
  for (const id of ['head', 'bar', 'popup']) {
    const n = document.getElementById(id);
    if (n) n.addEventListener('wheel', e => e.stopPropagation(), { passive: true });
  }
  // Umschalter im Panel: Linien ODER Status — damit passen beide ohne Scrollbalken
  function setPane(name) {
    document.body.dataset.pane = name === 'status' ? 'status' : 'lines';
    const bar = document.getElementById('panes');
    if (bar) bar.querySelectorAll('button').forEach(b => {
      const on = b.dataset.pane === document.body.dataset.pane;
      b.classList.toggle('on', on);
      b.setAttribute('aria-pressed', String(on));
    });
  }
  const paneBar = document.getElementById('panes');
  if (paneBar) {
    setPane('lines');
    paneBar.querySelectorAll('button').forEach(b => b.onclick = () => setPane(b.dataset.pane));
  }
  // Telefon: das Panel ist eine Schublade — Tippen auf die Karte schließt sie, der Schalter oben links
  // holt sie zurück bzw. schließt sie. Beschriftung und Symbol wechseln mit dem Zustand.
  hidePanelNow = () => setPanel(false);
  function setPanel(open) {
    document.body.classList.toggle('panel-closed', !open);
    const t = document.getElementById('paneltoggle');
    if (!t) return;
    t.setAttribute('aria-expanded', String(!!open));
    const lbl = t.querySelector('[data-i18n]');
    const ico = t.querySelector('span[aria-hidden]');
    if (ico) ico.textContent = open ? '✕' : '☰';
    if (lbl) {
      lbl.dataset.i18n = open ? 'closePanel' : 'openPanel';
      lbl.textContent = window.I18N.t(open ? 'closePanel' : 'openPanel');
    }
  }
  const panelToggle = document.getElementById('paneltoggle');
  const panelClose = document.getElementById('panelclose');
  if (panelToggle || panelClose) {
    if (panelToggle) panelToggle.onclick = () => setPanel(document.body.classList.contains('panel-closed'));
    if (panelClose) panelClose.onclick = () => setPanel(false);
    setPanel(true);                        // Start: offen, damit die Linien sofort wählbar sind
  }
  document.querySelectorAll('#lang button').forEach(b => b.onclick = () => window.I18N.set(b.dataset.lang));
  setAttribution();
  window.addEventListener('langchange', () => {
    buildLegend();
    if (state.selLine !== null) { const keep = state.selLine; state.selLine = null; selectLine(keep); }
    setAttribution();
    window.DarmstadtLive.setLang();
  });
  window.DarmstadtLive.attach({ map, overlay, deck, META, state, hex, shortStop, MODE_RGB, selectLine,
    hidePanel: () => { if (touchLayout()) setPanel(false); } });   // Telefon: Karte/Linienwahl schiebt das Panel weg
  document.getElementById('loading').remove();
  const start = () => { document.body.classList.add('live'); window.DarmstadtLive.setOn(true); };
  map.on('load', start);
  if (map.loaded()) start();
  (function loop() { window.DarmstadtLive.tick(); requestAnimationFrame(loop); })();
})();
</script>
