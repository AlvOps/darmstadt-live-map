<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b0e14">
<title>[RMV-Test] Meldungsleiste</title>
<style>
  :root { --bg:#0b0e14; --panel:#121722; --line:rgba(255,255,255,.09); --fg:#e6e9ef; --muted:#93a0b4; --accent:#ffd166; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); overflow:hidden;
    font:14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  /* Spalte: die Karte bekommt genau den Platz, den die Leiste nicht braucht. Nichts ueberlappt. */
  #shell { display:flex; flex-direction:column; height:100%; }
  #stage { position:relative; flex:1 1 auto; min-height:0; }
  #frame { position:absolute; inset:0; width:100%; height:100%; border:0; background:var(--bg); }

  #bar { flex:0 0 auto; background:var(--panel); border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom, 0px); }
  #bar[hidden] { display:none; }
  #head { display:flex; align-items:center; gap:8px; width:100%; min-height:36px; padding:0 12px;
    background:none; border:0; color:inherit; font:inherit; text-align:left; cursor:pointer; }
  #head:active { background:rgba(255,255,255,.04); }
  .badge { flex:none; background:var(--accent); color:#10131a; font-weight:800; font-size:10.5px;
    letter-spacing:.02em; padding:2px 7px; border-radius:6px; }
  #count { flex:none; font-weight:700; font-size:12.5px; }
  .spacer { flex:1; }
  #meta { flex:none; color:var(--muted); font-size:11px; }
  #lang { flex:none; background:rgba(255,255,255,.07); border:1px solid var(--line); color:var(--fg);
    font:inherit; font-size:11px; font-weight:800; padding:4px 9px; border-radius:6px; cursor:pointer; }
  #caret { flex:none; color:var(--muted); font-size:12px; }

  #list { list-style:none; margin:0; padding:0; max-height:42vh; overflow-y:auto;
    -webkit-overflow-scrolling:touch; border-top:1px solid var(--line); }
  #list[hidden] { display:none; }
  #list li { display:flex; gap:8px; align-items:flex-start; padding:6px 12px;
    border-bottom:1px solid rgba(255,255,255,.05); }
  #list li:last-child { border-bottom:0; }
  .line { flex:none; min-width:36px; text-align:center; font-weight:800; font-size:10.5px; color:#10131a;
    background:#2ec4b6; padding:2px 6px; border-radius:6px; margin-top:1px; }
  .body { flex:1; min-width:0; }
  .text { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; font-size:12.5px; }
  .when { color:var(--muted); font-size:10.5px; margin-top:1px; }
  a.text { color:inherit; text-decoration:none; }
  a.text:active { text-decoration:underline; }
</style>
</head>
<body>
<div id="shell">
  <div id="stage"><iframe id="frame" src="/" title="Karte"></iframe></div>
  <div id="bar" hidden>
    <button id="head" type="button" aria-expanded="false">
      <span class="badge">RMV</span>
      <span id="count">…</span>
      <span class="spacer"></span>
      <span id="meta">RMV HAFAS</span>
      <span id="caret">⌃</span>
    </button>
    <ul id="list" hidden></ul>
  </div>
</div>

<script>
  // Testseite: echte Karte im iframe (gleiche Herkunft), Meldungen in einer Leiste, die der Karte Platz laesst.
  // Uebersetzung ueber ein Glossar (kein externer Dienst, kein Schluessel); das deutsche Original bleibt Tooltip.
  (function () {
    var BASE = 'https://talos.taild11d3b.ts.net';
    var frame = document.getElementById('frame');
    // Kein eigener Umschalter: die Sprache kommt aus der Karte im iframe (deren EN/DE-Knopf oben rechts).
    function mapLang() {
      try {
        var el = frame && frame.contentDocument && frame.contentDocument.documentElement;
        var l = (el && (el.getAttribute('lang') || el.getAttribute('data-lang'))) || '';
        l = String(l).slice(0, 2).toLowerCase();
        if (l === 'en' || l === 'de') return l;
        var q = frame.contentWindow.location.search || '';
        if (/lang=en|lang=en-/i.test(q)) return 'en';
        if (/lang=de|lang=de-/i.test(q)) return 'de';
      } catch (e) { /* cross-origin: Standard */ }
      return 'de';
    }
    var lang = 'de';
    var items = [];
    var expanded = false;

    var GLOSSARY = [
      ['Haltestellenänderung', 'stop change'], ['Haltestellenverlegung', 'stop relocation'],
      ['Haltestellen entfallen', 'stops cancelled'], ['Haltestellen', 'stops'], ['Haltestelle', 'stop'],
      ['Fahrplanänderungen', 'schedule changes'], ['Fahrplanänderung', 'schedule change'],
      ['Teilausfälle', 'partial cancellations'], ['Teilausfall', 'partial cancellation'],
      ['Zugausfälle', 'train cancellations'], ['Ausfälle', 'cancellations'], ['Ausfall', 'cancellation'],
      ['Streckensperrung', 'line closure'], ['Umleitungen', 'diversions'], ['Umleitung', 'diversion'],
      ['Bauarbeiten', 'construction works'], ['Baustelle', 'roadworks'], ['Fahrplan', 'timetable'],
      ['Verspätungen', 'delays'], ['Verspätung', 'delay'], ['entfällt', 'cancelled'], ['entfallen', 'cancelled'],
      ['verlegt', 'relocated'], ['einzelnen', 'individual'], ['einzelne', 'individual'],
      ['Nächten', 'nights'], ['nachts', 'at night'], ['Wegen', 'Due to'], ['wegen', 'due to'],
      ['Störung', 'disruption'], ['Gleis', 'track'], ['Meldung', 'notice'], ['Busse', 'buses'],
      ['Ersatzverkehr', 'replacement service'], ['SEV', 'rail replacement service'],
      ['Rathaus', 'town hall'], ['Hauptbahnhof', 'main station'], ['Bahnhof', 'station']
    ];

    function translate(de) {
      if (lang !== 'en' || !de) return de;
      var out = String(de);
      GLOSSARY.forEach(function (p) { out = out.split(p[0]).join(p[1]); });
      return out;
    }

    function rel(iso) {
      var t = Date.parse(iso || '');
      if (!isFinite(t)) return '';
      var m = Math.round((Date.now() - t) / 60000);
      if (m < 2) return lang === 'en' ? 'just now' : 'gerade eben';
      if (m < 60) return lang === 'en' ? m + ' min ago' : 'vor ' + m + ' Min';
      var h = Math.round(m / 60);
      if (h < 36) return lang === 'en' ? h + ' hr ago' : 'vor ' + h + ' Std';
      var d = Math.round(h / 24);
      return lang === 'en' ? d + ' days ago' : 'vor ' + d + ' Tagen';
    }

    function colour(line) {
      var l = String(line || '').trim();
      if (/^\d/.test(l)) return '#ff6b6b';
      if (/^(S\d|SEV|RE|RB|IC|ICE|HLB)/i.test(l)) return '#c77dff';
      return '#2ec4b6';
    }

    var bar = document.getElementById('bar');
    var head = document.getElementById('head');
    var list = document.getElementById('list');
    var countEl = document.getElementById('count');
    var metaEl = document.getElementById('meta');
    var caret = document.getElementById('caret');

    function render() {
      list.textContent = '';
      items.forEach(function (n) {
        var li = document.createElement('li');
        var chip = document.createElement('span');
        chip.className = 'line';
        chip.textContent = n.line || '?';
        chip.style.background = colour(n.line);
        var body = document.createElement('div'); body.className = 'body';
        var text = document.createElement('a'); text.className = 'text';
        text.href = 'https://www.rmv.de/c/de/fahrplan/verkehrsmeldungen';
        text.target = '_blank'; text.rel = 'noopener noreferrer';
        var original = n.headline || n.text || '';
        text.textContent = translate(original) + ' \u2197';
        text.title = original + ' \u2014 ' + (lang === 'en' ? 'open RMV notices' : 'RMV-Meldungen oeffnen');
        var when = document.createElement('div'); when.className = 'when';
        when.textContent = rel(n.validFrom);
        body.appendChild(text); body.appendChild(when);
        li.appendChild(chip); li.appendChild(body);
        list.appendChild(li);
      });
      countEl.textContent = items.length + ' ' + (lang === 'en'
        ? (items.length === 1 ? 'notice' : 'notices')
        : (items.length === 1 ? 'Meldung' : 'Meldungen'));
    }

    head.onclick = function () {
      expanded = !expanded;
      list.hidden = !expanded;
      head.setAttribute('aria-expanded', String(expanded));
      caret.textContent = expanded ? '⌄' : '⌃';
    };

    // Der EN/DE-Knopf der Karte schaltet die Leiste mit: alle 1,2 s nachsehen (billig, rein lokal).
    setInterval(function () {
      var next = mapLang();
      if (next !== lang) { lang = next; render(); }
    }, 1200);

    function get(path) {
      var ctrl = typeof AbortController === 'function' ? new AbortController() : null;
      var timer = ctrl ? setTimeout(function () { ctrl.abort(); }, 8000) : null;
      return fetch(BASE + path, { cache: 'no-store', signal: ctrl ? ctrl.signal : undefined })
        .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
        .finally(function () { if (timer) clearTimeout(timer); });
    }

    get('/board?stop=3004734&duration=60').then(function (board) {
      var rows = (board && (board.departures || board.rows)) || [];
      var ids = [];
      rows.forEach(function (r) { if (r.lineId && ids.indexOf(r.lineId) < 0) ids.push(r.lineId); });
      if (!ids.length) throw new Error('keine Linien');
      return get('/notices?lineIds=' + encodeURIComponent(ids.slice(0, 50).join('|')));
    }).then(function (data) {
      var cutoff = Date.now() - 30 * 86400000;      // aeltere Meldungen raus
      items = ((data && data.notices) || []).filter(function (n) {
        var t = Date.parse(n.validFrom || '');
        return !isFinite(t) || t >= cutoff;
      }).sort(function (a, b) {
        return (Date.parse(b.validFrom) || 0) - (Date.parse(a.validFrom) || 0);
      });
      if (!items.length) { bar.hidden = true; return; }
      bar.hidden = false;
      render();
    }).catch(function (e) {
      bar.hidden = false;
      countEl.textContent = lang === 'en' ? 'no data' : 'keine Daten';
      metaEl.textContent = String((e && e.message) || e);
    });
  })();
</script>
</body>
</html>
