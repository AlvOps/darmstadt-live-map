<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b0e14">
<title>[RMV-Test] Meldungsleiste</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0e14; color: #e6e9ef; }
  #frame { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  /* Die Leiste liegt bewusst ausserhalb des iframes: sie kann dessen Start nie blockieren. */
  #bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    background: rgba(13, 17, 24, .96); border-top: 1px solid rgba(255, 255, 255, .14);
    font: 13px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif; color: #e6e9ef;
    max-height: 46vh; display: flex; flex-direction: column;
  }
  #bar[hidden] { display: none; }
  #head {
    display: flex; align-items: center; gap: 8px; width: 100%; min-height: 42px;
    padding: 0 12px; background: none; border: 0; color: inherit; font: inherit; text-align: left; cursor: pointer;
  }
  #head .badge { background: #ffd166; color: #10131a; font-weight: 800; font-size: 11px; padding: 2px 6px; border-radius: 5px; }
  #head .count { font-weight: 700; }
  #head .spacer { flex: 1; }
  #head .state { color: #9aa4b2; font-size: 11px; }
  #list { overflow: auto; margin: 0; padding: 0 0 6px; list-style: none; }
  #list[hidden] { display: none; }
  #list li { display: flex; gap: 8px; align-items: baseline; padding: 7px 12px; border-top: 1px solid rgba(255,255,255,.06); }
  .line { flex: none; font-weight: 800; font-size: 11px; color: #10131a; background: #2ec4b6; padding: 2px 6px; border-radius: 5px; }
  .text { flex: 1; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .when { flex: none; color: #9aa4b2; font-size: 11px; }
</style>
</head>
<body>
<iframe id="frame" src="/?rmvtest=1" title="Karte"></iframe>

<script>
  // Testseite: die echte Karte in einem iframe (gleiche Herkunft), die Meldungsleiste aussen herum.
  // Vorteil: die Karte kann durch die Leiste nie am Laden gehindert werden. Nachteil: keine Rueckmeldung
  // in die Karte - fuer einen Test der RMV-Daten reicht es.
  (function () {
    var BASE = 'https://talos.taild11d3b.ts.net';
    var frame = document.getElementById('frame');
    var bar, list, countEl, stateEl, expanded = false;

    function el(tag, cls, text) {
      var n = document.createElement(tag);
      if (cls) n.className = cls;
      if (text != null) n.textContent = text;
      return n;
    }

    function build() {
      if (bar) return;
      bar = el('div'); bar.id = 'bar'; bar.hidden = true;
      var head = el('button'); head.id = 'head'; head.type = 'button'; head.setAttribute('aria-expanded', 'false');
      head.appendChild(el('span', 'badge', 'RMV'));
      countEl = el('span', 'count', 'lade …'); head.appendChild(countEl);
      head.appendChild(el('span', 'spacer'));
      stateEl = el('span', 'state', ''); head.appendChild(stateEl);
      head.onclick = function () {
        expanded = !expanded;
        list.hidden = !expanded;
        head.setAttribute('aria-expanded', String(expanded));
      };
      list = el('ul'); list.id = 'list'; list.hidden = true;
      bar.appendChild(head); bar.appendChild(list);
      document.body.appendChild(bar);
    }

    function rel(iso) {
      var t = Date.parse(iso || '');
      if (!isFinite(t)) return '';
      var m = Math.round((Date.now() - t) / 60000);
      if (m < 2) return 'gerade eben';
      if (m < 60) return 'vor ' + m + ' Min';
      var h = Math.round(m / 60);
      if (h < 36) return 'vor ' + h + ' Std';
      return 'vor ' + Math.round(h / 24) + ' Tagen';
    }

    function colour(line) {
      var l = String(line || '');
      if (/^(RE|RB|S\d|SEV|IC|ICE)/i.test(l)) return '#c77dff';
      if (/^\d/.test(l)) return '#ff6b6b';
      return '#2ec4b6';
    }

    function render(items) {
      build();
      list.textContent = '';
      if (!items.length) {
        bar.hidden = true;
        return;
      }
      items.slice().sort(function (a, b) {
        return (Date.parse(b.validFrom) || 0) - (Date.parse(a.validFrom) || 0);
      }).forEach(function (n) {
        var li = el('li');
        var chip = el('span', 'line', n.line || '?');
        chip.style.background = colour(n.line);
        li.appendChild(chip);
        li.appendChild(el('span', 'text', n.headline || n.text || ''));
        li.appendChild(el('span', 'when', rel(n.validFrom)));
        list.appendChild(li);
      });
      countEl.textContent = items.length + (items.length === 1 ? ' Meldung' : ' Meldungen');
      stateEl.textContent = 'RMV HAFAS';
      bar.hidden = false;
    }

    function fail(msg) {
      build();
      countEl.textContent = 'keine Daten';
      stateEl.textContent = msg;
      bar.hidden = false;
    }

    function get(path) {
      var ctrl = typeof AbortController === 'function' ? new AbortController() : null;
      var timer = ctrl ? setTimeout(function () { ctrl.abort(); }, 8000) : null;
      return fetch(BASE + path, { cache: 'no-store', signal: ctrl ? ctrl.signal : undefined })
        .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
        .finally(function () { if (timer) clearTimeout(timer); });
    }

    get('/board?stop=3004734&duration=60').then(function (board) {
      var rows = (board && (board.departures || board.rows)) || [];
      var ids = [];
      rows.forEach(function (r) { if (r.lineId && ids.indexOf(r.lineId) < 0) ids.push(r.lineId); });
      if (!ids.length) { fail('keine Linien'); return; }
      return get('/notices?lineIds=' + encodeURIComponent(ids.slice(0, 50).join('|')))
        .then(function (data) { render((data && data.notices) || []); });
    }).catch(function (e) { fail(String((e && e.message) || e)); });
  })();
</script>
</body>
</html>
